version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: qato-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: qato-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 10

  clickhouse:
    image: yandex/clickhouse-server:latest
    container_name: qato-clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9001:9000" # Native client interface (mapped to 9001 to avoid conflict)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/config.xml # Optional: for custom config
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "" # No password by default for 'default' user
      CLICKHOUSE_DB: default
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8123/ping"]
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  clickhouse_data:
